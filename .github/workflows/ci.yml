name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  suite:
    name: test (${{ matrix.os }})
    strategy:
      matrix: { os: [ubuntu-latest, macos-latest] }
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run format:check
        if: matrix.os == 'ubuntu-latest'
      - run: npm run typecheck
        if: matrix.os == 'ubuntu-latest'
      - run: npm test
      - run: npm run build
      - run: npm run check:release

  package:
    name: package (Node ${{ matrix.node }})
    strategy:
      matrix: { node: [18, 24] }
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run check:release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: "${{ matrix.node }}" }
      - run: npm run test:package
        env:
          npm_config_engine_strict: "${{ matrix.node != 18 }}"
      - run: docker build -t antigravity-mcp-smoke .
        if: matrix.node == 24

  # The one status the main branch ruleset requires; green only when every
  # platform in the matrix is.
  test:
    if: ${{ always() }}
    needs: [suite, package, commitlint]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate to succeed
        env:
          SUITE_RESULT: ${{ needs.suite.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          COMMITLINT_RESULT: ${{ needs.commitlint.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$SUITE_RESULT" = success
          test "$PACKAGE_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$COMMITLINT_RESULT" = success
          fi

  commitlint:
    if: github.event_name == 'pull_request'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
