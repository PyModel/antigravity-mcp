<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="1280" height="500" role="img" aria-labelledby="capabilities-title capabilities-description">
  <title id="capabilities-title">Antigravity MCP — one bridge between your host and Gemini 4 Neon</title>
  <desc id="capabilities-description">Architecture and capabilities, not benchmark results. Pi, OpenCode, Codex, or Claude Code connects as an MCP client to Antigravity MCP. The bridge resolves account model IDs, continues conversation sessions, and applies output limits and redaction. The Antigravity CLI runs an available model such as Gemini 4 Neon, whose listed effort tiers are low, medium, high, and xhigh. Findings, usage, session IDs, and partial-result status return to the host.</desc>
  <defs>
    <linearGradient id="capabilities-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1522"/>
      <stop offset="1" stop-color="#0c1019"/>
    </linearGradient>
    <linearGradient id="capabilities-bridge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#133437"/>
      <stop offset="1" stop-color="#132633"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1278" height="498" rx="24" fill="url(#capabilities-bg)" stroke="#263647"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="64" fill="#f0f6fb" font-size="35" font-weight="700" letter-spacing="-0.5">Delegate through one bridge.</text>
    <text x="64" y="101" fill="#9fb4c7" font-size="21">Choose a listed model, preserve the session, and bring back the result.</text>
    <text x="1216" y="61" fill="#99d9c9" font-size="15" letter-spacing="1.5" text-anchor="end">ANTIGRAVITY MCP</text>

    <!-- Host choice: no single client is the privileged entry point. -->
    <rect x="64" y="146" width="268" height="228" rx="16" fill="#111e2b" stroke="#344958"/>
    <text x="86" y="180" fill="#8fa9bc" font-size="14" letter-spacing="1.5">01 / YOUR MCP CLIENT</text>
    <g fill="#dbe8f2" font-size="23" font-weight="600">
      <text x="86" y="228">Pi</text>
      <text x="198" y="228">OpenCode</text>
      <text x="86" y="274">Codex</text>
      <text x="198" y="274" font-size="20">Claude Code</text>
    </g>
    <path d="M 86 301 H 310" stroke="#2b4051"/>
    <text x="86" y="337" fill="#9fb6c7" font-size="19">Your tools and workflow</text>

    <!-- The MCP surface is separate from the agy subprocess. -->
    <rect x="414" y="146" width="388" height="228" rx="16" fill="url(#capabilities-bridge)" stroke="#5eae9f"/>
    <text x="440" y="180" fill="#9ed6c9" font-size="14" letter-spacing="1.5">02 / THE BRIDGE</text>
    <text x="440" y="225" fill="#f0f8f7" font-size="30" font-weight="700" letter-spacing="-0.4">Antigravity MCP</text>
    <g fill="#8be0bd">
      <circle cx="445" cy="265" r="3"/>
      <circle cx="445" cy="300" r="3"/>
      <circle cx="445" cy="335" r="3"/>
    </g>
    <g fill="#b8d2d8" font-size="20">
      <text x="462" y="272">Resolve account model IDs</text>
      <text x="462" y="307">Continue conversation sessions</text>
      <text x="462" y="342">Output limits and redaction</text>
    </g>

    <!-- Model availability is determined by the user's account. -->
    <rect x="884" y="146" width="332" height="228" rx="16" fill="#111e2b" stroke="#344958"/>
    <text x="908" y="180" fill="#8fa9bc" font-size="14" letter-spacing="1.5">03 / ANTIGRAVITY CLI</text>
    <text x="908" y="225" fill="#b0efd0" font-size="30" font-weight="700" letter-spacing="-0.4">Gemini 4 Neon</text>
    <g fill="#192d3b" stroke="#36515e">
      <rect x="908" y="248" width="132" height="34" rx="7"/>
      <rect x="1052" y="248" width="140" height="34" rx="7"/>
      <rect x="908" y="292" width="132" height="34" rx="7"/>
      <rect x="1052" y="292" width="140" height="34" rx="7"/>
    </g>
    <g fill="#bed2df" font-size="18" text-anchor="middle">
      <text x="974" y="271">low</text>
      <text x="1122" y="271">medium</text>
      <text x="974" y="315">high</text>
      <text x="1122" y="315">xhigh</text>
    </g>
    <text x="1050" y="353" fill="#8fa9bc" font-size="17" text-anchor="middle">Use a variant listed by agy models.</text>

    <!-- Request and response paths. -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
      <path d="M 346 252 H 398 M 392 246 L 398 252 L 392 258 M 816 252 H 870 M 864 246 L 870 252 L 864 258" stroke="#8be0bd"/>
      <path d="M 398 276 H 346 M 352 270 L 346 276 L 352 282 M 870 276 H 816 M 822 270 L 816 276 L 822 282" stroke="#708da3"/>
    </g>
    <g fill="#9bb3c4" font-size="16" text-anchor="middle">
      <text x="373" y="232">MCP</text>
      <text x="843" y="232">agy</text>
    </g>

    <path d="M 64 409 H 1216" stroke="#293c4b"/>
    <text x="64" y="444" fill="#c5d6e3" font-size="21">Findings · Usage · Session IDs · Partial-result status</text>
    <text x="64" y="476" fill="#8fa9bc" font-size="18">Model availability follows your account's live agy inventory.</text>
    <path d="M 1200 443 H 1106 M 1115 434 L 1106 443 L 1115 452" fill="none" stroke="#83cfb8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
