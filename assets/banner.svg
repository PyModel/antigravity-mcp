<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="1280" height="500" role="img" aria-labelledby="banner-title banner-description">
  <title id="banner-title">Antigravity MCP — Gemini 4 Neon from your coding agent</title>
  <desc id="banner-description">A bridge to the Antigravity CLI for research, code analysis, and implementation. Choose Pi, OpenCode, Codex, or Claude Code as your MCP client. The illustrated model selection is Gemini 4 Neon High; available models and effort tiers come from your agy account.</desc>
  <defs>
    <linearGradient id="banner-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1522"/>
      <stop offset="1" stop-color="#0c1019"/>
    </linearGradient>
    <linearGradient id="banner-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b5f7c9"/>
      <stop offset="1" stop-color="#65dcd5"/>
    </linearGradient>
    <radialGradient id="banner-glow">
      <stop offset="0" stop-color="#286d66" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#286d66" stop-opacity="0"/>
    </radialGradient>
    <pattern id="banner-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 H 0 V 40" fill="none" stroke="#7ba5aa" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="banner-clip"><rect x="1" y="1" width="1278" height="498" rx="24"/></clipPath>
  </defs>
  <rect x="1" y="1" width="1278" height="498" rx="24" fill="url(#banner-bg)" stroke="#263647"/>
  <g clip-path="url(#banner-clip)">
    <ellipse cx="1010" cy="80" rx="450" ry="360" fill="url(#banner-glow)"/>
    <rect x="716" y="0" width="564" height="348" fill="url(#banner-grid)"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <!-- A simple orbital mark, drawn entirely as vectors. -->
    <g fill="none" stroke="url(#banner-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 65 72 L 80 43 L 95 72 M 72 60 H 88"/>
      <path d="M 61 68 C 57 58 93 48 99 57 C 103 64 77 76 67 74" stroke-width="1.5"/>
    </g>
    <text x="112" y="64" fill="#9cbdc3" font-size="15" letter-spacing="1.6">MODEL CONTEXT PROTOCOL / ANTIGRAVITY CLI / v2.0.0</text> <!-- x-release-please-version -->
    <text x="64" y="148" fill="#f0f6fb" font-size="66" font-weight="700" letter-spacing="-2">Antigravity MCP</text>
    <text x="66" y="211" fill="url(#banner-accent)" font-size="42" font-weight="600" letter-spacing="-0.7">Gemini 4 Neon.</text>
    <text x="66" y="259" fill="#c3d1df" font-size="23">Research, analyze, and implement with agy.</text>
    <text x="66" y="292" fill="#94a9bd" font-size="23">Keep using the coding agent you choose.</text>

    <!-- Illustrative selection, not a promise of account availability. -->
    <rect x="756" y="58" width="460" height="264" rx="18" fill="#101e2b" stroke="#35525e"/>
    <text x="782" y="96" fill="#8faeb9" font-size="15" letter-spacing="1.2">EXAMPLE MODEL SELECTION</text>
    <circle cx="1175" cy="94" r="17" fill="#193a3b"/>
    <path d="M 1175 83 L 1178 91 L 1186 94 L 1178 97 L 1175 105 L 1172 97 L 1164 94 L 1172 91 Z" fill="#9aefcd"/>
    <text x="782" y="151" fill="#f0f6fb" font-size="33" font-weight="700" letter-spacing="-0.5">Gemini 4 Neon</text>
    <text x="783" y="187" fill="#a0e5d2" font-family="'Courier New', Courier, monospace" font-size="21">gemini-4-neon-high</text>
    <path d="M 782 208 H 1190" stroke="#2d4351"/>
    <g font-size="17" text-anchor="middle">
      <rect x="782" y="228" width="82" height="36" rx="8" fill="#172b39" stroke="#36515d"/>
      <text x="823" y="252" fill="#b6cbd8">Low</text>
      <rect x="874" y="228" width="108" height="36" rx="8" fill="#172b39" stroke="#36515d"/>
      <text x="928" y="252" fill="#b6cbd8">Medium</text>
      <rect x="992" y="228" width="86" height="36" rx="8" fill="url(#banner-accent)"/>
      <text x="1035" y="252" fill="#102a29" font-weight="700">High</text>
      <rect x="1088" y="228" width="102" height="36" rx="8" fill="#172b39" stroke="#36515d"/>
      <text x="1139" y="252" fill="#b6cbd8">XHigh</text>
    </g>
    <text x="782" y="295" fill="#93aebc" font-size="17">Select from your account's live model inventory.</text>

    <path d="M 64 348 H 1216" stroke="#293c4b"/>
    <text x="64" y="381" fill="#8fa7bb" font-size="14" letter-spacing="1.8">CHOOSE YOUR MCP CLIENT</text>
    <g fill="#d9e5ee" font-size="25" font-weight="600" text-anchor="middle">
      <text x="208" y="422">Pi</text>
      <text x="496" y="422">OpenCode</text>
      <text x="784" y="422">Codex</text>
      <text x="1072" y="422">Claude Code</text>
    </g>
    <path d="M 352 400 V 429 M 640 400 V 429 M 928 400 V 429" stroke="#2b3e4e"/>
    <text x="640" y="466" fill="#90a9bd" font-size="18" text-anchor="middle">Your choice of host · Account-aware model routing · Session continuity</text>
  </g>
</svg>
